# Railway's edge proxy connects from its private range and puts the visitor's
# address in X-Forwarded-For. Without this, PrivateBin's per-IP rate limit
# would see one address (the proxy) for every visitor.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
